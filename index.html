<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Expense Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!--
  Everything inside #app is a Vue template. Vue reads it once, then keeps
  the page in sync with the data in script.js:
    {{ ... }}   prints a value (and escapes it, so typed HTML stays plain text)
    v-model     two-way binds an input to a piece of data
    v-for       repeats an element for each item in a list
    v-if        only renders the element when the condition is true
    :attr       sets an attribute from data  (short for v-bind:attr)
    @event      runs code on an event        (short for v-on:event)
  v-cloak hides the raw template until Vue has mounted.
-->
<main id="app" class="wrap" v-cloak>
  <div class="receipt">
    <header class="head">
     <h1>Expense Ledger</h1>
<p class="sub">track one-time and recurring spending</p>
    </header>

    <form class="form" @submit.prevent="addExpense">
      <input
        id="description"
        ref="descInput"
        v-model="draft.description"
        type="text"
        placeholder="What did you buy?"
        autocomplete="off"
        required
      />

      <div class="freq" role="radiogroup" aria-label="How often">
        <label v-for="(info, key) in frequencies" :key="key">
          <input type="radio" name="frequency" :value="key" v-model="draft.frequency" />
          <span>{{ info.name }}</span>
        </label>
      </div>

      <div class="form-row">
        <input
          id="amount"
          v-model.number="draft.amount"
          type="number"
          step="0.01"
          min="0.01"
          placeholder="0.00"
          required
        />
        <select id="category" v-model="draft.category">
          <option v-for="category in categories" :key="category">{{ category }}</option>
        </select>
        <button type="submit" class="add-btn">Add</button>
      </div>
    </form>

    <category-filter
    :categories="categories"
    :selected="activeCategory"
    @select="activeCategory = $event"
    ></category-filter>

    <!-- transition-group animates rows as they're added and removed -->
    <transition-group tag="ul" name="row" class="list">
      <expense-row
        v-for="expense in filteredExpenses"
        :key="expense.id"
        :expense="expense"
        @delete="deleteExpense(expense.id)"
      ></expense-row> 
    </transition-group>

    <p v-if="filteredExpenses.length === 0" class="empty">No expenses in this category yet.</p>

    <div class="breakdown">
      <div class="breakdown-cell">
        <span class="breakdown-label">One-time</span>
        <span class="breakdown-value">{{ money(totals.once) }}</span>
      </div>
      <div class="breakdown-cell">
        <span class="breakdown-label">Monthly</span>
        <span class="breakdown-value">{{ money(totals.monthly) }}/mo</span>
      </div>
      <div class="breakdown-cell">
        <span class="breakdown-label">Yearly</span>
        <span class="breakdown-value">{{ money(totals.yearly) }}/yr</span>
      </div>
    </div>

    <div class="total-row">
      <span>Est. yearly cost</span>
      <span class="total-amount">{{ money(totals.perYear) }}</span>
    </div>
  </div>

  <p class="hint">Built with <code>Vue 3</code> · saved in your browser</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/vue@3.5.43/dist/vue.global.prod.js"></script>
<script src="script.js"></script>
</body>
</html>
