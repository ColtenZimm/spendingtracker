<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Expense Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="wrap">
  <div class="receipt">
    <header class="head">
      <h1>Expense Ledger</h1>
      <p class="sub">practice: filter · reduce · map · destructuring</p>
    </header>

    <form id="expense-form" class="form">
      <input id="description" type="text" placeholder="What did you buy?" autocomplete="off" required />
      <div class="form-row">
        <input id="amount" type="number" step="0.01" min="0.01" placeholder="0.00" required />
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Housing</option>
          <option>Entertainment</option>
          <option>Utilities</option>
          <option>Other</option>
        </select>
        <button type="submit" class="add-btn">Add</button>
      </div>
    </form>

    <div id="filter-bar" class="filter-bar">
      <button class="chip active" data-category="All">All</button>
      <button class="chip" data-category="Food">Food</button>
      <button class="chip" data-category="Transport">Transport</button>
      <button class="chip" data-category="Housing">Housing</button>
      <button class="chip" data-category="Entertainment">Entertainment</button>
      <button class="chip" data-category="Utilities">Utilities</button>
      <button class="chip" data-category="Other">Other</button>
    </div>

    <ul id="expense-list" class="list"></ul>
    <p id="empty-state" class="empty" hidden>No expenses in this category yet.</p>

    <div class="total-row">
      <span>Total</span>
      <span id="total" class="total-amount">$0.00</span>
    </div>
  </div>

  <p class="hint">Five TODOs are waiting in <code>script.js</code> — the app won't do anything until you fill them in.</p>
</main>

<script src="script.js"></script>
</body>
</html>
